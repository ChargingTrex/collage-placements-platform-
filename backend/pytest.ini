[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = core accounts roster profiles matching opportunities certifications
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:PyPDF2.*
    ignore::DeprecationWarning:reportlab.*
    # Two DRF routers each register the format-suffix converter.
    ignore:Converter 'drf_format_suffix' is already registered:django.utils.deprecation.RemovedInDjango60Warning
