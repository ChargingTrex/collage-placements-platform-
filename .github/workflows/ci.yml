name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: placement
          POSTGRES_PASSWORD: placement
          POSTGRES_DB: placement_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U placement"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://placement:placement@localhost:5432/placement_test
      DJANGO_SECRET_KEY: ci-secret
      # CI runs the TF-IDF backend: identical code paths, no 40MB model download.
      MATCHING_BACKEND: tfidf

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrations apply cleanly from an empty database
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: No missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        working-directory: backend
        run: python manage.py check --deploy --fail-level ERROR

      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
